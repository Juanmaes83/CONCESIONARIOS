name: Bootstrap from Restaurant Premium

on:
  push:
    branches:
      - feat/restaurant-clone-concesionarios-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CONCESIONARIOS branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone restaurant premium source
        run: |
          rm -rf /tmp/restaurant-premium-source
          git clone --depth 1 --branch class7-dish-journey-premium https://github.com/Juanmaes83/WEB-RESTAURACI-N-PREMIUM-DIN-MICA.git /tmp/restaurant-premium-source

      - name: Replace target content with restaurant clone
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/restaurant-premium-source/. .
          rm -rf .git/modules || true

      - name: Commit cloned base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: clone restaurant premium base for dealerships" || exit 0
          git push origin HEAD:feat/restaurant-clone-concesionarios-base
