name: NOVA V4 QA
on:
  push:
    branches: [feat/concesionarios-restaurant-clone-base]
  pull_request:
    branches: [main]
jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve NOVA
        run: |
          python3 -m http.server 4173 > /tmp/nova-server.log 2>&1 &
          sleep 2
      - name: Run NOVA V4 browser QA
        run: node tests/nova-v4-e2e.mjs
      - name: Upload NOVA V4 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-v4-qa
          path: qa/
