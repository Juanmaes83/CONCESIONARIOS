name: Bootstrap Restaurant Clone To Feature Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare clean feature branch from initial repository commit
        run: |
          git checkout -B feat/concesionarios-restaurant-clone-base e031a2920e8c67eedb777799fa8f0f60780cfad4

      - name: Clone restaurant premium source
        run: |
          rm -rf /tmp/restaurant-premium-source
          git clone --depth 1 --branch class7-dish-journey-premium https://github.com/Juanmaes83/WEB-RESTAURACI-N-PREMIUM-DIN-MICA.git /tmp/restaurant-premium-source

      - name: Replace feature branch content with restaurant clone
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/restaurant-premium-source/. .
          rm -rf .git/modules || true
          rm -rf .github || true
          mkdir -p docs/concesionarios
          cat > docs/concesionarios/ADAPTATION-BRIEF.md <<'EOF'
          # CONCESIONARIOS — Adaptación desde Restaurante Premium

          ## Objetivo

          Este proyecto parte del clon técnico de `WEB-RESTAURACI-N-PREMIUM-DIN-MICA` rama `class7-dish-journey-premium`.

          No se busca construir un restaurante. Se reutiliza la arquitectura didáctica y visual del restaurante para crear una web premium de concesionarios con panel personalizable.

          ## Equivalencias de producto

          - Restaurante / marca gastronómica → concesionario premium.
          - Platos signature → vehículos destacados.
          - Dish Journey → Vehicle Journey.
          - Origen / atmósfera / chef / reserva → diseño / prestaciones / experiencia / cita.
          - Ficha gastronómica → ficha técnica + emocional del coche.
          - Reserva mesa → solicitar prueba / contacto comercial.

          ## Reglas de imagen

          - Usar coches premium tipo Tesla como primera línea visual.
          - Imágenes recortadas, sin fondo o fondo transparente cuando sea posible.
          - No generar más de 2 imágenes del mismo coche/plano.
          - Evitar series repetitivas del mismo prompt.
          - Priorizar variedad real: frontal 3/4, lateral hero, interior, detalle óptica, detalle llanta.

          ## Próximo bloque de trabajo

          1. Renombrar lenguaje restaurante → concesionario.
          2. Crear panel personalizado para marca, vehículos, CTAs, imágenes y fichas.
          3. Sustituir Dish Journey por Vehicle Journey.
          4. Preparar preset Tesla / concesionario premium.
          5. Validar visualmente con preview antes de entregar enlace.
          EOF
          cat > README.md <<'EOF'
          # CONCESIONARIOS

          Web premium de concesionarios basada en la arquitectura del proyecto `WEB-RESTAURACI-N-PREMIUM-DIN-MICA`.

          ## Estado

          Base clonada desde Restaurante Premium para iniciar adaptación a concesionarios.

          ## Fuente técnica

          - Origen: `Juanmaes83/WEB-RESTAURACI-N-PREMIUM-DIN-MICA`
          - Rama origen: `class7-dish-journey-premium`
          - Destino: `Juanmaes83/CONCESIONARIOS`

          ## Objetivo

          Crear una web premium para concesionarios con:

          - carrusel visual de vehículos;
          - fichas editables;
          - panel personalizado;
          - storytelling por vehículo;
          - CTA de prueba/contacto;
          - presets de marca;
          - QA visual antes de entrega.
          EOF

      - name: Commit cloned base to clean feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: clone restaurant premium base for dealerships" || exit 0
          git push origin HEAD:feat/concesionarios-restaurant-clone-base --force
