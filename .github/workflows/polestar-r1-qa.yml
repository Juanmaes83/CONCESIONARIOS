name: Polestar R1 Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve NOVA
        run: |
          python3 -m http.server 4173 >/tmp/nova-http.log 2>&1 &
          sleep 2
      - name: Run Polestar R1 visual QA
        run: node tests/polestar-r1-e2e.mjs
      - name: Upload Polestar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polestar-r1-qa
          path: qa-polestar/
          if-no-files-found: error
